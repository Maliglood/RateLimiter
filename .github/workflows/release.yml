name: Release Build

on:
  push:
    tags:
      - 'v*' # Запускается при пуше тега, начинающегося с 'v', например, v1.0.0

permissions:
  contents: write

jobs:
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Build binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o bin/rate-limiter ./cmd/server
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: bin/rate-limiter